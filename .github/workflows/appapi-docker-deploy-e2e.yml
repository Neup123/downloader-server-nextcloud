name: Disposable AppAPI Docker ExApp deployment acceptance

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/appapi-docker-deploy-e2e.yml"
      - "tests/test_appapi_deploy_workflow.py"
      - "nextcloud_exapp/**"
      - "appinfo/info.xml"
      - "scripts/exapp_release_manifest.py"
      - "scripts/exapp_build_inputs.py"
      - "tests/test_exapp_build_inputs.py"
      - "tests/test_exapp_release_manifest.py"
      - "tests/test_exapp_publication_workflow.py"
      - ".github/workflows/publish-exapp-commit-image.yml"
      - "tests/exapp_mock_core.py"
      - "web/**"
      - "bridge/**"
  pull_request:
    paths:
      - ".github/workflows/appapi-docker-deploy-e2e.yml"
      - "tests/test_appapi_deploy_workflow.py"
      - "nextcloud_exapp/**"
      - "appinfo/info.xml"
      - "scripts/exapp_release_manifest.py"
      - "scripts/exapp_build_inputs.py"
      - "tests/test_exapp_build_inputs.py"
      - "tests/test_exapp_release_manifest.py"
      - "tests/test_exapp_publication_workflow.py"
      - ".github/workflows/publish-exapp-commit-image.yml"
      - "tests/exapp_mock_core.py"
      - "web/**"
      - "bridge/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disposable-appapi-docker-deploy-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  docker-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Create masked credentials and isolated Docker network
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import secrets
          for name in ("NEXTCLOUD_APP_PASSWORD", "APPAPI_DSP_PASSWORD"):
              value = ("nc-" if name == "NEXTCLOUD_APP_PASSWORD" else "") + secrets.token_urlsafe(32)
              print("::add-mask::" + value)
              with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
                  out.write(f"{name}={value}\n")
          PY
          docker network create downloader-appapi-ci

      - name: Start clean Nextcloud 35 container and trusted-network DSP
        shell: bash
        run: |
          set -euo pipefail
          docker run --detach \
            --name downloader-appapi-nextcloud \
            --hostname downloader-appapi-nextcloud \
            --network downloader-appapi-ci \
            -p 127.0.0.1:8099:80 \
            -e SQLITE_DATABASE=nextcloud.db \
            -e NEXTCLOUD_ADMIN_USER=admin \
            -e NEXTCLOUD_ADMIN_PASSWORD="$NEXTCLOUD_APP_PASSWORD" \
            -e "NEXTCLOUD_TRUSTED_DOMAINS=127.0.0.1 localhost downloader-appapi-nextcloud" \
            nextcloud:35.0.2-apache

          # Docker Socket Proxy is privileged *only on this disposable CI runner*.
          # It is attached to a private user-defined bridge and exposes no host port.
          docker run --detach \
            --name downloader-appapi-dsp \
            --hostname downloader-appapi-dsp \
            --network downloader-appapi-ci \
            -e NC_HAPROXY_PASSWORD="$APPAPI_DSP_PASSWORD" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --privileged \
            ghcr.io/nextcloud/nextcloud-appapi-dsp:v1.5.3

      - name: Wait for fully installed disposable Nextcloud
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import time
          from urllib.request import urlopen
          for _ in range(180):
              try:
                  with urlopen("http://127.0.0.1:8099/status.php", timeout=3) as response:
                      status = json.load(response)
                  if status.get("installed") and not status.get("maintenance"):
                      print("Nextcloud 35 installation ready")
                      break
              except (OSError, ValueError):
                  pass
              time.sleep(2)
          else:
              raise SystemExit("Disposable Nextcloud did not become ready")
          PY

      - name: Register a real AppAPI Deploy Daemon on disposable Docker
        shell: bash
        run: |
          set -euo pipefail
          docker exec --user www-data downloader-appapi-nextcloud php occ app:enable app_api
          docker exec --user www-data downloader-appapi-nextcloud php occ app_api:daemon:register \
            downloader-ci-dsp "Disposable CI Docker" docker-install http \
            downloader-appapi-dsp:2375 http://downloader-appapi-nextcloud/index.php \
            --net=downloader-appapi-ci \
            --haproxy_password="$APPAPI_DSP_PASSWORD" --set-default
          docker exec --user www-data downloader-appapi-nextcloud php occ app_api:daemon:list

      - name: Prove full Docker ExApp lifecycle with pinned upstream test manifest
        shell: bash
        run: |
          set -euo pipefail
          # This is Nextcloud's official disposable skeleton, not Downloader Server.
          # Pin its info.xml to a known upstream source commit for repeatability.
          manifest="https://raw.githubusercontent.com/nextcloud/app-skeleton-python/64448cc066e498e8ae74bb65cc11c60566935b11/appinfo/info.xml"
          docker exec --user www-data downloader-appapi-nextcloud php occ app_api:app:register \
            app-skeleton-python downloader-ci-dsp --info-xml "$manifest"
          docker exec --user www-data downloader-appapi-nextcloud php occ app_api:app:enable \
            app-skeleton-python
          docker inspect nc_app_app-skeleton-python --format '{{.State.Running}}' | grep -Fx true
          docker exec --user www-data downloader-appapi-nextcloud php occ app_api:app:list \
            | grep -F "app-skeleton-python"
          docker exec --user www-data downloader-appapi-nextcloud php occ app_api:app:disable \
            app-skeleton-python
          docker exec --user www-data downloader-appapi-nextcloud php occ app_api:app:unregister \
            app-skeleton-python

      - name: Build and deploy our Downloader Server ExApp from a local CI image
        shell: bash
        run: |
          set -euo pipefail
          token="$(python3 -c 'import secrets; print(secrets.token_urlsafe(48))')"
          echo "::add-mask::$token"
          echo "DOWNLOADER_TEST_CORE_TOKEN=$token" >> "$GITHUB_ENV"

          # The public version tag in appinfo/info.xml must match exactly.
          # Only the disposable runner has this image; no registry is published.
          docker build -f nextcloud_exapp/Dockerfile \
            -t ghcr.io/neup123/downloader-server-nextcloud:0.5.3 .

          docker run --detach \
            --name downloader-test-core \
            --network downloader-appapi-ci \
            -e MOCK_CORE_TOKEN="$token" \
            -v "$PWD/tests/exapp_mock_core.py:/fixture.py:ro" \
            python:3.13-alpine python /fixture.py

          docker cp appinfo/info.xml downloader-appapi-nextcloud:/tmp/downloader-info.xml
          # AppAPI explicitly supports a source-registry -> local mapping.
          # This bypasses a remote pull only on this disposable CI daemon.
          docker exec --user www-data downloader-appapi-nextcloud \
            php occ app_api:daemon:registry:add downloader-ci-dsp \
            --registry-from=ghcr.io --registry-to=local
          docker exec --user www-data downloader-appapi-nextcloud \
            php occ app_api:app:register downloader-server-nextcloud downloader-ci-dsp \
            --info-xml /tmp/downloader-info.xml \
            --env "DOWNLOADER_API_URL=http://downloader-test-core:8080" \
            --env "DOWNLOADER_API_TOKEN=$token" \
            --env "DOWNLOADER_ALLOW_TRUSTED_HTTP=true" \
            --wait-finish
          docker inspect nc_app_downloader-server-nextcloud \
            --format '{{.State.Running}}' | grep -Fx true

      - name: Install native PHP bridge into real disposable Nextcloud Files and Dashboard
        shell: bash
        run: |
          set -euo pipefail
          (cd bridge && npm install --no-audit --no-fund && npm test && npm run build)
          install -d bridge-install/downloader_bridge
          cp -a bridge/appinfo bridge/lib bridge/js bridge-install/downloader_bridge/
          docker cp bridge-install/downloader_bridge downloader-appapi-nextcloud:/var/www/html/custom_apps/downloader_bridge
          docker exec --user www-data downloader-appapi-nextcloud php occ app:enable downloader_bridge
          docker exec --user www-data downloader-appapi-nextcloud php occ app:list --output=json \
            | python3 -c 'import json,sys; data=json.load(sys.stdin); assert "downloader_bridge" in data.get("enabled", {}), data'
          # The Activity provider and scheduler register during actual Nextcloud
          # bootstrap. Verify registration without contacting the downloader core.
          docker exec --user www-data downloader-appapi-nextcloud php occ status --output=json \
            | python3 -c 'import json,sys; assert json.load(sys.stdin)["installed"]'
          echo "Native PHP bridge enabled on disposable Nextcloud 35"

      - name: Verify AppAPI signing and actual authenticated proxy forwarding
        shell: bash
        run: |
          set -euo pipefail
          # Two actual Nextcloud users for signed per-user entitlement smoke.
          docker exec --user www-data -e OC_PASS="$NEXTCLOUD_APP_PASSWORD" \
            downloader-appapi-nextcloud php occ user:add --password-from-env alice
          docker exec --user www-data -e OC_PASS="$NEXTCLOUD_APP_PASSWORD" \
            downloader-appapi-nextcloud php occ user:add --password-from-env bob

          exapp_env="$(docker inspect nc_app_downloader-server-nextcloud \
            --format '{{range .Config.Env}}{{println .}}{{end}}')"
          secret="$(printf '%s\n' "$exapp_env" | sed -n 's/^APP_SECRET=//p')"
          port="$(printf '%s\n' "$exapp_env" | sed -n 's/^APP_PORT=//p')"
          test -n "$secret"
          test -n "$port"
          echo "::add-mask::$secret"
          docker run --rm -i --network downloader-appapi-ci \
            -e EXAPP_SECRET="$secret" \
            -e EXAPP_PORT="$port" \
            -e NC_USER_TEST_PASSWORD="$NEXTCLOUD_APP_PASSWORD" \
            python:3.13-alpine python - <<'PY'
          import base64
          import json
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = f"http://nc_app_downloader-server-nextcloud:{os.environ['EXAPP_PORT']}"
          for attempt in range(90):
              try:
                  with urlopen(base + "/heartbeat", timeout=3) as r:
                      if json.load(r).get("status") == "ok":
                          break
              except (URLError, OSError, ValueError):
                  pass
              time.sleep(1)
          else:
              raise SystemExit("Our ExApp never became ready")
          url = base + "/api/v1/jobs"
          try:
              urlopen(url, timeout=5)
          except HTTPError as exc:
              assert exc.code == 401, f"Unsigned request returned {exc.code}"
          else:
              raise AssertionError("ExApp accepted an unsigned request")

          signature = base64.b64encode(
              f"admin:{os.environ['EXAPP_SECRET']}".encode()
          ).decode()
          request = Request(url, headers={
              "EX-APP-ID": "downloader-server-nextcloud",
              "EX-APP-VERSION": "0.5.3",
              "AUTHORIZATION-APP-API": signature,
              "Authorization": "Bearer must-not-reach-core",
              "Cookie": "session=must-not-reach-core",
          })
          with urlopen(request, timeout=20) as response:
              data = json.load(response)
          assert data[0]["id"] == "ci-proxy-verified", data
          print("Signed AppAPI request forwarded to local test origin; unsigned denied")
          # Verify user-scoped ExApp behavior against real disposable Nextcloud.
          def signed_request(identity, path, *, method="GET", payload=None):
              signature = base64.b64encode(
                  f"{identity}:{os.environ['EXAPP_SECRET']}".encode()
              ).decode()
              headers = {
                  "EX-APP-ID": "downloader-server-nextcloud",
                  "EX-APP-VERSION": "0.5.3",
                  "AUTHORIZATION-APP-API": signature,
              }
              if payload is not None:
                  headers["Content-Type"] = "application/json"
              return Request(
                  base + path, data=json.dumps(payload).encode() if payload is not None else None,
                  headers=headers, method=method,
              )

          for identity in ("alice", "bob"):
              try:
                  urlopen(signed_request(identity, "/user/api/me"), timeout=20)
              except HTTPError as exc:
                  assert exc.code == 403, f"Ungrant user {identity} was not denied"
              else:
                  raise AssertionError("A user without entitlement got a Downloader page")

          with urlopen(signed_request(
              "admin", "/admin/api/entitlements", method="PUT",
              payload={"allowed_users": "alice"}
          ), timeout=45) as response:
              allowed = json.load(response)
          assert "alice" in allowed["allowed_users"]

          with urlopen(signed_request("alice", "/user/api/me"), timeout=30) as response:
              identity = json.load(response)
          assert identity == {"user_id": "alice", "entitled": True}

          with urlopen(signed_request("alice", "/user/api/settings"), timeout=30) as response:
              settings = json.load(response)
          assert settings["app_password_configured"] is False
          assert settings["destination_folder"] == "Downloads"

          # Exercise real Nextcloud user Files PROPFIND, not a Python mock.
          # A newly created user has no Downloads folder by default.
          def dav_folder():
              auth = base64.b64encode(
                  f"alice:{os.environ['NC_USER_TEST_PASSWORD']}".encode()
              ).decode()
              return Request(
                  "http://downloader-appapi-nextcloud/remote.php/dav/files/alice/Downloads/",
                  headers={"Authorization": "Basic " + auth, "Depth": "0"},
                  method="PROPFIND",
              )
          try:
              urlopen(dav_folder(), timeout=20)
          except HTTPError as exc:
              assert exc.code == 404, f"Unexpected pre-existing Downloads response: {exc.code}"
          else:
              raise AssertionError("Fresh test user unexpectedly has Downloads folder")

          with urlopen(signed_request(
              "alice", "/user/api/settings", method="PUT",
              payload={"app_password": "ci-only-unused-dav-secret"}
          ), timeout=30) as response:
              configured = json.load(response)
          assert configured["app_password_configured"] is True

          # The mock core DOES NOT download. Its POST response is an
          # independent gate that the ExApp's real nc_py_api Files calls
          # successfully created the missing /Downloads folder.
          with urlopen(signed_request(
              "alice", "/user/api/jobs", method="POST",
              payload={"url": "https://example.test/dummy.pdf", "engine": "generic"}
          ), timeout=45) as response:
              created = json.load(response)
          assert created["owner_id"] == "alice", created
          assert created["delivery"]["folder"] == "Downloads", created
          with urlopen(dav_folder(), timeout=30) as response:
              assert response.status == 207, response.status
              assert b"collection" in response.read().lower()
          print("Real AppAPI + Nextcloud Files: first-use /Downloads created in Alice's own Files")

          # The visual folder picker calls this signed, owner-scoped read-only
          # endpoint; verify actual nc_py_api listdir against Nextcloud DAV.
          with urlopen(signed_request("alice", "/user/api/folders"), timeout=30) as response:
              root_folders = json.load(response)
          assert root_folders["path"] == ""
          assert {"name": "Downloads", "path": "Downloads"} in root_folders["folders"], root_folders
          with urlopen(signed_request("alice", "/user/api/folders?path=Downloads"), timeout=30) as response:
              nested_folders = json.load(response)
          assert nested_folders["path"] == "Downloads", nested_folders
          for disallowed in (
              "/user/api/folders?path=..%2FPrivate",
              "/user/api/folders?offset=-1",
          ):
              try:
                  urlopen(signed_request("alice", disallowed), timeout=20)
              except HTTPError as exc:
                  assert exc.code == 422, (disallowed, exc.code)
              else:
                  raise AssertionError("Invalid folder-picker parameters were accepted")

          with urlopen(signed_request(
              "alice", "/user/api/settings", method="PUT",
              payload={"destination_folder": "Downloads", "notify_finished": False}
          ), timeout=30) as response:
              changed = json.load(response)
          assert changed["destination_folder"] == "Downloads"
          assert changed["notify_finished"] is False
          assert changed["app_password_configured"] is True, "Ordinary preference patch erased credential"
          print("Real signed Nextcloud Files picker and partial nonsecret autosave: PASS")

          try:
              urlopen(signed_request("bob", "/user/api/me"), timeout=20)
          except HTTPError as exc:
              assert exc.code == 403
          else:
              raise AssertionError("Non-entitled Bob accessed Alice's Downloader")
          print("Signed per-user Nextcloud routes: Alice entitled, Bob denied, personal settings scoped")

          PY
          docker exec --user www-data downloader-appapi-nextcloud \
            php occ app_api:app:disable downloader-server-nextcloud
          docker exec --user www-data downloader-appapi-nextcloud \
            php occ app_api:app:unregister downloader-server-nextcloud

      - name: Collect diagnostic logs on failure
        if: failure()
        shell: bash
        run: |
          docker logs --tail 150 downloader-appapi-dsp 2>&1 || true
          docker logs --tail 150 downloader-appapi-nextcloud 2>&1 || true
          docker logs --tail 100 nc_app_downloader-server-nextcloud 2>&1 || true
          docker logs --tail 100 downloader-test-core 2>&1 || true
          docker ps -a --filter "network=downloader-appapi-ci" || true

      - name: Remove all disposable containers, volumes and network
        if: always()
        shell: bash
        run: |
          set +e
          docker rm --force --volumes downloader-appapi-nextcloud downloader-appapi-dsp downloader-test-core
          docker ps -a --format '{{.Names}}' | grep '^nc_app_' | xargs -r docker rm --force --volumes
          docker network rm downloader-appapi-ci

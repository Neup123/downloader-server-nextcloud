name: Sync verified core upstream into Nextcloud main

# Shared history is already established. Merge with normal ancestry and preserve
# the downstream README, while keeping all core-owned source files upstream-led.
on:
  push:
    branches: [main]
    paths: [".github/workflows/bootstrap-upstream.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: core-upstream-sync
  cancel-in-progress: false

jobs:
  sync-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Merge current core main with established shared history
        id: merge
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Neup123/Media-Downloader-server.git
          git fetch --no-tags upstream main
          core_sha="$(git rev-parse upstream/main)"
          if git merge-base --is-ancestor "$core_sha" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Core main is already incorporated."
            exit 0
          fi

          # The README is intentionally Nextcloud-specific. Any other conflict
          # requires manual inspection rather than an automatic content choice.
          if git merge --no-ff --no-commit upstream/main; then
            echo "Core changes merged without conflicts."
          else
            if [[ ! -f .git/MERGE_HEAD ]]; then
              echo "Unexpected merge failure" >&2
              exit 1
            fi
            unresolved="$(git diff --name-only --diff-filter=U)"
            if [[ "$unresolved" != "README.md" ]]; then
              echo "Unexpected merge conflicts: $unresolved" >&2
              exit 1
            fi
            git checkout --ours README.md
            git add README.md
          fi
          if [[ -n "$(git ls-files -u)" ]]; then
            echo "Unresolved merge conflicts remain" >&2
            exit 1
          fi
          git diff --exit-code upstream/main -- BLUEPRINT.md
          # Nextcloud owns its own CI; do not import core's weekly release
          # schedulers or duplicate workflow files. This also avoids the
          # GitHub Actions token's restriction on creating workflow files.
          git restore --source=HEAD --staged --worktree .github/workflows
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo "Core workflow changes unexpectedly staged" >&2
            exit 1
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Verify combined repository Python and Nextcloud tests
        if: steps.merge.outputs.changed == 'true'
        env:
          DATA_DIR: /tmp/downloader-test-data
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt pytest PyYAML
          python -m compileall -q app scripts tests
          python -m pytest -q
          python -m unittest discover -s tests -p 'test_appapi_*.py' -v
          python -m unittest discover -s tests -p 'test_nextcloud_*.py' -v
          python -m unittest discover -s tests -p 'test_target_*.py' -v

      - name: Verify merged production Docker image builds
        if: steps.merge.outputs.changed == 'true'
        run: docker build --tag downloader-server:nextcloud-upstream-acceptance .

      - name: Commit tested merge to downstream main
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git commit -m "Merge accepted core main into Nextcloud integration"
          git push origin HEAD:main

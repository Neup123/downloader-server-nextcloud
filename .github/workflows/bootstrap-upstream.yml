name: Sync verified core upstream into Nextcloud main

# Shared history is already established. Merge with normal ancestry and preserve
# the downstream README, while keeping all core-owned source files upstream-led.
# This workflow revision triggers the next verified core import.
# The isolated upstream worktree tests ALL core modules; the merged tree
# executes the exact reviewed Nextcloud-owned module manifest.
on:
  push:
    branches: [main]
    paths: [".github/workflows/bootstrap-upstream.yml"]
  workflow_dispatch:
    inputs:
      expected_core_sha:
        description: "Optional exact 40-character core/main SHA; abort if core changed"
        required: false
        type: string
      revalidate_current_main:
        description: "Re-run complete accepted core and Nextcloud gates and dispatch AppAPI for an existing main"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  actions: write

concurrency:
  group: core-upstream-sync
  cancel-in-progress: false

jobs:
  sync-core:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Merge current core main with established shared history
        id: merge
        shell: bash
        env:
          EXPECTED_CORE_SHA: ${{ inputs.expected_core_sha }}
          REVALIDATE_CURRENT_MAIN: ${{ inputs.revalidate_current_main }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Neup123/Media-Downloader-server.git
          git fetch --no-tags upstream main
          core_sha="$(git rev-parse upstream/main)"
          # Never interpolate manual input directly into bash source.
          if [[ -n "$EXPECTED_CORE_SHA" ]]; then
            if [[ ! "$EXPECTED_CORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Expected upstream SHA must be exactly 40 lowercase hex characters" >&2
              exit 1
            fi
            if [[ "$core_sha" != "$EXPECTED_CORE_SHA" ]]; then
              echo "Core main changed since requested SHA; aborting without merge" >&2
              exit 1
            fi
          fi
          if git merge-base --is-ancestor "$core_sha" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Core main is already incorporated."
            # Recheck a known-good existing main only on a workflow-file push
            # or explicit manual revalidation. The daily schedule stays cheap.
            if [[ "$GITHUB_EVENT_NAME" == "push" || "$REVALIDATE_CURRENT_MAIN" == "true" ]]; then
              echo "reverify=true" >> "$GITHUB_OUTPUT"
              echo "Revalidating existing main before trusted AppAPI dispatch."
            else
              echo "reverify=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # The README is intentionally Nextcloud-specific. Any other conflict
          # requires manual inspection rather than an automatic content choice.
          if git merge --no-ff --no-commit upstream/main; then
            echo "Core changes merged without conflicts."
          else
            if [[ ! -f .git/MERGE_HEAD ]]; then
              echo "Unexpected merge failure" >&2
              exit 1
            fi
            python3 scripts/resolve_upstream_conflicts.py
          fi
          if [[ -n "$(git ls-files -u)" ]]; then
            echo "Unresolved merge conflicts remain" >&2
            exit 1
          fi
          git diff --exit-code upstream/main -- BLUEPRINT.md
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "reverify=false" >> "$GITHUB_OUTPUT"

      - name: Verify upstream Python tests in isolated core worktree
        if: steps.merge.outputs.changed == 'true' || steps.merge.outputs.reverify == 'true'
        env:
          DATA_DIR: /tmp/downloader-core-test-data
        run: |
          set -euo pipefail
          # Core tests inspect core-only workflow files; run against the exact
          # fetched upstream commit, never the downstream workflow directory.
          git worktree add --detach /tmp/downloader-core-acceptance upstream/main
          python -m pip install -r /tmp/downloader-core-acceptance/requirements.txt pytest PyYAML
          (cd /tmp/downloader-core-acceptance && python -m pytest -q)

      - name: Verify merged core files and downstream Nextcloud behavior
        if: steps.merge.outputs.changed == 'true' || steps.merge.outputs.reverify == 'true'
        env:
          DATA_DIR: /tmp/downloader-nextcloud-test-data
        run: |
          set -euo pipefail
          # Keep Nextcloud's own release and cleanup policies. The resolver
          # temporarily used core workflow files only to settle Git conflicts.
          # Core-only audit tests (such as test_audited_core_legacy_cleanup.py)
          # run above in the isolated upstream worktree. Never glob-import
          # those tests into Nextcloud's different branch-cleanup code.
          git restore --source=HEAD --staged --worktree README.md .github/workflows
          # No downstream edits to core-owned backend contracts are permitted.
          # Host-level acceptance code is core-owned as well: it must be
          # imported intact, never replaced with a downstream-only copy.
          git diff --exit-code upstream/main -- app openapi.yaml requirements.txt Dockerfile Dockerfile.egress compose.egress.yaml scripts/egress_guard.sh scripts/guarded_host_acceptance.py EGRESS_GUARD.md
          python -m compileall -q app scripts tests nextcloud_exapp
          # The reviewed downstream module manifest excludes core-only tests,
          # including ones already imported into downstream Git ancestry.
          # The owner-scoped UI/onboarding tests import nc_py_api; run them
          # against the same exact-version Nextcloud runtime lock as the ExApp.
          python -m pip install -r nextcloud_exapp/requirements.lock
          python3 scripts/run_downstream_acceptance.py

      - name: Verify merged production Docker image builds
        if: steps.merge.outputs.changed == 'true' || steps.merge.outputs.reverify == 'true'
        run: docker build --tag downloader-server:nextcloud-upstream-acceptance .

      - name: Commit tested merge to downstream main
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # Core tests inspect core workflow versions temporarily staged by
          # the resolver; preserve downstream README and *all* its workflows
          # only after tests and Docker build have passed.
          git restore --source=HEAD --staged --worktree README.md .github/workflows
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo "Core workflow changes unexpectedly staged" >&2
            exit 1
          fi
          git commit -m "Merge accepted core main into Nextcloud integration"
          git push origin HEAD:main

      - name: Validate and archive the exact verified core-to-main merge provenance
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # This runs AFTER the full core/downstream test suites, Docker build
          # and successful merge push; an unpushed or drifted main fails closed.
          python3 scripts/record_core_sync.py --output core-sync-evidence.json

      - name: Upload accepted core-sync provenance evidence
        if: steps.merge.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verified-core-sync-${{ github.run_id }}
          path: core-sync-evidence.json
          if-no-files-found: error
          retention-days: 60

      - name: Prove and archive revalidated existing main without inventing a new merge
        if: steps.merge.outputs.reverify == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # This runs ONLY after exact core/downstream tests and Docker passed.
          # Current HEAD can be a regular squash commit, not a core merge.
          python3 scripts/record_core_sync.py \
            --revalidate-existing-main \
            --output current-main-revalidation.json

      - name: Upload accepted existing-main revalidation evidence
        if: steps.merge.outputs.reverify == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verified-current-main-${{ github.run_id }}
          path: current-main-revalidation.json
          if-no-files-found: error
          retention-days: 60

      - name: Dispatch full AppAPI acceptance for the accepted main
        if: steps.merge.outputs.changed == 'true' || steps.merge.outputs.reverify == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          accepted_sha="$(git rev-parse HEAD)"
          actual_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$actual_main" != "$accepted_sha" ]]; then
            echo "Main moved since synchronized merge; refusing stale dispatch" >&2
            exit 1
          fi
          # A push made with GITHUB_TOKEN does not start normal push workflows.
          # workflow_dispatch is an explicitly permitted GitHub Actions event.
          # The AppAPI lifecycle test then runs on actual main and the
          # separate publisher requires its success plus main ancestry.
          if [[ "${GITHUB_REPOSITORY:-}" != "Neup123/downloader-server-nextcloud" ]]; then
            echo "Refusing AppAPI dispatch outside the authorized Nextcloud repository" >&2
            exit 1
          fi
          # A Git checkout with an upstream remote can make gh select core by
          # default; always use the exact downstream repository explicitly.
          gh workflow view appapi-docker-deploy-e2e.yml --repo "$GITHUB_REPOSITORY" >/dev/null
          gh workflow run appapi-docker-deploy-e2e.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched real ExApp AppAPI acceptance on verified Nextcloud main"

name: Sync verified core upstream into Nextcloud main

# Revalidate the owner-approved BSL license along with core-owned source.
# This update triggers an accepted upstream import (Core #102/#106/#131).
# Shared history is already established. Merge with normal ancestry and preserve
# the downstream README, while keeping all core-owned source files upstream-led.
# This workflow revision triggers the next verified core import.
# The isolated upstream worktree tests ALL core modules; the merged tree
# executes the exact reviewed Nextcloud-owned module manifest.
on:
  push:
    branches: [main]
    paths: [".github/workflows/bootstrap-upstream.yml"]
  pull_request:
    branches: [main]
    types: [closed]
  workflow_dispatch:
    inputs:
      expected_core_sha:
        description: "Optional exact 40-character core/main SHA; abort if core changed"
        required: false
        type: string
      revalidate_current_main:
        description: "Re-run complete accepted core and Nextcloud gates and dispatch AppAPI for an existing main"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: write
  actions: write
  pull-requests: write

concurrency:
  group: core-upstream-sync
  cancel-in-progress: false

jobs:
  sync-core:
    # No privileged execution for forks or unrelated PRs. After a sync PR is
    # merged, revalidate actual main, never the PR's untrusted checkout.
    if: github.repository == 'Neup123/downloader-server-nextcloud' && (github.event_name != 'pull_request' && github.ref == 'refs/heads/main' || github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'automatic/core-sync-'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Merge current core main with established shared history
        id: merge
        shell: bash
        env:
          EXPECTED_CORE_SHA: ${{ inputs.expected_core_sha }}
          REVALIDATE_CURRENT_MAIN: ${{ inputs.revalidate_current_main }}
          ACCEPTED_PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/Neup123/Media-Downloader-server.git
          git fetch --no-tags upstream main
          core_sha="$(git rev-parse upstream/main)"
          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]]; then
            # Squash/rebase can discard the source ancestry. Require the
            # reviewed topic itself to be an ancestor of actual main.
            [[ "$ACCEPTED_PR_HEAD" =~ ^[0-9a-f]{40}$ ]]
            git merge-base --is-ancestor "$ACCEPTED_PR_HEAD" HEAD
          fi
          # Never interpolate manual input directly into bash source.
          if [[ -n "$EXPECTED_CORE_SHA" ]]; then
            if [[ ! "$EXPECTED_CORE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
              echo "Expected upstream SHA must be exactly 40 lowercase hex characters" >&2
              exit 1
            fi
            if [[ "$core_sha" != "$EXPECTED_CORE_SHA" ]]; then
              echo "Core main changed since requested SHA; aborting without merge" >&2
              exit 1
            fi
          fi
          if git merge-base --is-ancestor "$core_sha" HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Core main is already incorporated."
            # Recheck a known-good existing main only on a workflow-file push
            # or explicit manual revalidation. The daily schedule stays cheap.
            if [[ "$GITHUB_EVENT_NAME" == "push" || "$GITHUB_EVENT_NAME" == "pull_request" || "$REVALIDATE_CURRENT_MAIN" == "true" ]]; then
              echo "reverify=true" >> "$GITHUB_OUTPUT"
              echo "Revalidating existing main before trusted AppAPI dispatch."
            else
              echo "reverify=false" >> "$GITHUB_OUTPUT"
            fi
            exit 0
          fi

          # The README is intentionally Nextcloud-specific. Any other conflict
          # requires manual inspection rather than an automatic content choice.
          if git merge --no-ff --no-commit upstream/main; then
            echo "Core changes merged without conflicts."
          else
            if [[ ! -f .git/MERGE_HEAD ]]; then
              echo "Unexpected merge failure" >&2
              exit 1
            fi
            python3 scripts/resolve_upstream_conflicts.py
          fi
          if [[ -n "$(git ls-files -u)" ]]; then
            echo "Unresolved merge conflicts remain" >&2
            exit 1
          fi
          git diff --exit-code upstream/main -- BLUEPRINT.md
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "reverify=false" >> "$GITHUB_OUTPUT"

      - name: Verify upstream Python tests in isolated core worktree
        if: steps.merge.outputs.changed == 'true' || steps.merge.outputs.reverify == 'true'
        env:
          DATA_DIR: /tmp/downloader-core-test-data
        run: |
          set -euo pipefail
          # Core tests inspect core-only workflow files; run against the exact
          # fetched upstream commit, never the downstream workflow directory.
          git worktree add --detach /tmp/downloader-core-acceptance upstream/main
          python -m pip install -r /tmp/downloader-core-acceptance/requirements.txt pytest PyYAML
          (cd /tmp/downloader-core-acceptance && python -m pytest -q)

      - name: Verify merged core files and downstream Nextcloud behavior
        if: steps.merge.outputs.changed == 'true' || steps.merge.outputs.reverify == 'true'
        env:
          DATA_DIR: /tmp/downloader-nextcloud-test-data
        run: |
          set -euo pipefail
          # Keep Nextcloud's own release and cleanup policies. The resolver
          # temporarily used core workflow files only to settle Git conflicts.
          # Core-only audit tests (such as test_audited_core_legacy_cleanup.py)
          # run above in the isolated upstream worktree. Never glob-import
          # those tests into Nextcloud's different branch-cleanup code.
          git restore --source=HEAD --staged --worktree README.md .github/workflows
          # No downstream edits to core-owned backend contracts are permitted.
          # Host-level acceptance code is core-owned as well: it must be
          # imported intact, never replaced with a downstream-only copy.
          # Core #134 publishes the canonical status vocabulary. Require its
          # exact source from the tested upstream revision before importing
          # downstream consumer contracts, rather than copying a hand-edited
          # Nextcloud version or silently keeping legacy constants.
          git cat-file -e upstream/main:app/job_states.py
          test -s app/job_states.py
          # app/delivery.py and app/schemas.py carry approved downstream features
          # and are exempt from byte parity; all other Core paths stay protected.
          git diff --exit-code upstream/main -- LICENSE app openapi.yaml requirements.txt Dockerfile Dockerfile.egress compose.egress.yaml scripts/egress_guard.sh scripts/guarded_host_acceptance.py EGRESS_GUARD.md ':(exclude)app/delivery.py' ':(exclude)app/schemas.py'
          # Core's legacy App.tsx is deliberately different in this ExApp
          # adaptation; ui-options.ts carries approved downstream features
          # and is exempt from byte parity. All other web/src files stay protected.
          # Enumerate upstream paths rather than excluding all of web/src:
          # newly added shared UI modules become protected automatically.
          git cat-file -e upstream/main:web/src/App.tsx
          mapfile -t shared_ui < <(
            git ls-tree -r --name-only upstream/main -- web/src |
              grep -vFx 'web/src/App.tsx' |
              grep -vFx 'web/src/ui-options.ts'
          )
          test "${#shared_ui[@]}" -gt 0
          git diff --exit-code upstream/main -- "${shared_ui[@]}"
          python -m compileall -q app scripts tests nextcloud_exapp
          # The reviewed downstream module manifest excludes core-only tests,
          # including ones already imported into downstream Git ancestry.
          # The owner-scoped UI/onboarding tests import nc_py_api; run them
          # against the same exact-version Nextcloud runtime lock as the ExApp.
          python -m pip install -r nextcloud_exapp/requirements.lock
          # A Core job status change must regenerate BOTH independently
          # packaged Nextcloud consumers before any accepted sync/publish.
          # The source enum is tested above in upstream/main; this compares
          # its byte-derived Python/PHP contracts against the merged tree.
          # Generate only deterministic leaf consumers from the freshly
          # verified upstream Core enum; then verify and stage exactly those
          # three source-derived files in the accepted merged tree.
          python3 -m scripts.bridge_job_state_contract
          git add -- bridge/lib/JobStateContract.php nextcloud_exapp/job_state_contract.py bridge/src/job-states.generated.mjs
          python3 -m scripts.bridge_job_state_contract --check
          python3 scripts/run_downstream_acceptance.py

      - name: Verify merged production Docker image builds
        if: steps.merge.outputs.changed == 'true' || steps.merge.outputs.reverify == 'true'
        run: docker build --tag downloader-server:nextcloud-upstream-acceptance .

      - name: Open tested upstream candidate PR without pushing main
        if: steps.merge.outputs.changed == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git restore --source=HEAD --staged --worktree README.md .github/workflows
          if git diff --cached --name-only | grep -q '^.github/workflows/'; then
            echo "Core workflow changes unexpectedly staged" >&2
            exit 1
          fi
          core_sha="$(git rev-parse upstream/main)"
          previous_main="$(git rev-parse HEAD)"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$previous_main"
          git commit -m "Merge accepted core main into Nextcloud integration"
          candidate="$(git rev-parse HEAD)"
          test "$(git rev-parse HEAD^2)" = "$core_sha"
          branch="automatic/core-sync-${core_sha:0:12}-${previous_main:0:12}"
          remote_candidate="$(git ls-remote origin "refs/heads/$branch" | cut -f1)"
          if [[ -n "$remote_candidate" ]]; then
            git fetch --no-tags origin "refs/heads/$branch"
            test "$(git rev-parse FETCH_HEAD)" = "$remote_candidate"
            test "$(git rev-parse FETCH_HEAD^1)" = "$previous_main"
            test "$(git rev-parse FETCH_HEAD^2)" = "$core_sha"
            git diff --exit-code HEAD FETCH_HEAD --
            candidate="$remote_candidate"
          else
            git push origin "HEAD:refs/heads/$branch"
          fi
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$candidate"
          number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [[ -z "$number" ]]; then
            gh pr create --repo "$GITHUB_REPOSITORY" --base main --head "$branch" \
              --title "Sync verified Core ${core_sha:0:12}" \
              --body "Candidate $candidate preserves Core $core_sha as its second parent. Local upstream/downstream tests and Docker build passed in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID. Approve PR workflows if GitHub requests it; merge only after all required PR checks succeed. Use a merge commit, not squash or rebase. Main is not yet accepted."
            number="$(gh pr list --repo "$GITHUB_REPOSITORY" --base main --head "$branch" --state open --json number --jq '.[0].number // empty')"
          fi
          [[ "$number" =~ ^[0-9]+$ ]]
          test "$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)" = "$candidate"
          python3 - "$core_sha" "$candidate" "$previous_main" "$number" <<'PY'
          import json, sys
          from pathlib import Path
          core, candidate, base, number = sys.argv[1:]
          Path("core-sync-candidate.json").write_text(json.dumps({
              "record_type": "tested-candidate-not-accepted-main",
              "source_commit": core, "candidate_commit": candidate,
              "downstream_base": base, "pull_request": int(number),
              "accepted_main": False, "production_nextcloud_target_verified": False,
          }, sort_keys=True, indent=2) + "\n")
          PY

      - name: Upload tested candidate evidence (not main acceptance)
        if: steps.merge.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: core-sync-candidate-${{ github.run_id }}
          path: core-sync-candidate.json
          if-no-files-found: error
          retention-days: 60

      - name: Prove and archive revalidated existing main without inventing a new merge
        if: steps.merge.outputs.reverify == 'true'
        shell: bash
        run: |
          set -euo pipefail
          # This runs ONLY after exact core/downstream tests and Docker passed.
          # Current HEAD may contain the reviewed sync merge as an ancestor.
          python3 scripts/record_core_sync.py \
            --revalidate-existing-main \
            --output current-main-revalidation.json

      - name: Upload accepted existing-main revalidation evidence
        if: steps.merge.outputs.reverify == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: verified-current-main-${{ github.run_id }}
          path: current-main-revalidation.json
          if-no-files-found: error
          retention-days: 60

      - name: Dispatch full AppAPI acceptance for the accepted main
        if: steps.merge.outputs.reverify == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          accepted_sha="$(git rev-parse HEAD)"
          actual_main="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [[ "$actual_main" != "$accepted_sha" ]]; then
            echo "Main moved since synchronized merge; refusing stale dispatch" >&2
            exit 1
          fi
          # A push made with GITHUB_TOKEN does not start normal push workflows.
          # workflow_dispatch is an explicitly permitted GitHub Actions event.
          # The AppAPI lifecycle test then runs on actual main and the
          # separate publisher requires its success plus main ancestry.
          if [[ "${GITHUB_REPOSITORY:-}" != "Neup123/downloader-server-nextcloud" ]]; then
            echo "Refusing AppAPI dispatch outside the authorized Nextcloud repository" >&2
            exit 1
          fi
          # A Git checkout with an upstream remote can make gh select core by
          # default; always use the exact downstream repository explicitly.
          gh workflow view appapi-docker-deploy-e2e.yml --repo "$GITHUB_REPOSITORY" >/dev/null
          gh workflow run appapi-docker-deploy-e2e.yml --repo "$GITHUB_REPOSITORY" --ref main
          echo "Dispatched real ExApp AppAPI acceptance on verified Nextcloud main"

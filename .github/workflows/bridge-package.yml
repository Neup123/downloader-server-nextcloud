name: Build Nextcloud UI-only PHP bridge

on:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - "app/job_states.py"
      - "scripts/bridge_job_state_contract.py"
      - ".github/workflows/bridge-package.yml"
  pull_request:
    paths:
      - "bridge/**"
      - "app/job_states.py"
      - "scripts/bridge_job_state_contract.py"
      - ".github/workflows/bridge-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Build supported Nextcloud Files UI integration
        working-directory: bridge
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build
          test -s js/bridge.js
          test -s js/dashboard.js
          test -s js/library.js
          test -s js/settings.js
      - name: Verify build chain with only the bridge package mounted
        run: |
          isolated="$(mktemp -d)"
          trap 'rm -rf "$isolated"' EXIT
          mkdir -p "$isolated/bridge"
          cp -a bridge/. "$isolated/bridge/"
          rm -rf "$isolated/bridge/node_modules" "$isolated/bridge/js"
          cd "$isolated/bridge"
          npm install --no-audit --no-fund
          npm test
          npm run build
          test -s js/bridge.js
          test -s js/dashboard.js
          test -s js/library.js
          test -s js/settings.js
      - name: Verify native PHP contract is generated from imported Core source
        run: python3 -m scripts.bridge_job_state_contract --check
      - name: Check native PHP syntax
        run: |
          php -l bridge/lib/AppInfo/Application.php
          php -l bridge/lib/Controller/LibraryController.php
          php -l bridge/lib/Settings/PersonalSettings.php
          php -l bridge/lib/Settings/PersonalSection.php
          php -l bridge/appinfo/routes.php
          php -l bridge/lib/Listener/AssetsListener.php
          php -l bridge/lib/Dashboard/DownloadsWidget.php
          php -l bridge/lib/Search/DownloadsProvider.php
          php -l bridge/lib/Activity/Setting.php
          php -l bridge/lib/Activity/Provider.php
          php -l bridge/lib/BackgroundJob/ActivitySync.php
          php -l bridge/lib/EntitlementPolicy.php
          php -l bridge/lib/JobStateContract.php
          php -l bridge/tests/job-state-contract.php
          php -l bridge/tests/entitlement-contract.php
      - name: Create installable native Nextcloud app
        run: |
          mkdir -p package/downloader_bridge
          cp -a bridge/appinfo bridge/lib bridge/js bridge/templates package/downloader_bridge/
          cp bridge/README.md package/downloader_bridge/
          cd package
          zip -q -r ../downloader-bridge-0.5.3.zip downloader_bridge
      - uses: actions/upload-artifact@v4
        with:
          name: downloader-bridge-nc35
          path: downloader-bridge-0.5.3.zip
          retention-days: 30

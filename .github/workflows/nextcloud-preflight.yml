name: Nextcloud preflight checks

on:
  push:
    branches: [main, "tooling/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Compile script and tests
        run: python -m compileall -q scripts tests
      - name: Run offline preflight tests
        run: python -m unittest discover -s tests -v

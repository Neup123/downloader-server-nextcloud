openapi: 3.1.0
info:
  title: Downloader Server — developer API
  version: 0.1.0
  description: >-
    Submit and manage downloads, inspect installed engines and configure file delivery.
    Send your administrator API key in the X-API-Key header on protected requests.
    This token gives full service access and must never appear in public browser code.
    Only the health check and API reference are unauthenticated.
tags:
  - name: jobs
    description: Submit links, inspect progress, cancel or retry, and verify deliveries.
  - name: engines
    description: Inspect installed downloader engines and configure their options.
  - name: settings
    description: Manage saved engine presets and URL routing.
  - name: delivery
    description: Choose local storage or WebDAV delivery.
servers:
  - url: /api/v1
security:
  - ApiKeyAuth: []
paths:
  /preview:
    post:
      operationId: previewYtDlpMedia
      summary: Inspect yt-dlp media formats or the first playlist entries without downloading
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, minLength: 8, maxLength: 4096 }
                max_entries: { type: integer, minimum: 1, maximum: 100, default: 50 }
            example: {url: 'https://example.org/video', max_entries: 20}
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: Sanitized formats or selected playlist entry metadata }
        '422': { description: Invalid or unsupported URL, or preview failed }
  /engines:
    get:
      operationId: listEngines
      summary: List available download engines and their defaults
      tags: [engines]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Engine capabilities and default settings
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/EngineStatusOut' } }
  /engines/{engine_name}/options:
    parameters:
      - name: engine_name
        in: path
        required: true
        schema: { type: string, enum: [yt-dlp, aria2c, gallery-dl, generic, you-get, svtplay-dl, get-sauce] }
    get:
      operationId: getEngineOptionCatalog
      summary: List typed common engine option fields for graphical settings
      tags: [engines]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Categorized option fields with types and labels
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EngineOptionsOut' }
        '404': { description: Unknown engine }
  /engines/{engine_name}/settings:
    parameters:
      - name: engine_name
        in: path
        required: true
        schema: { type: string, enum: [yt-dlp, aria2c, gallery-dl, generic, you-get, svtplay-dl, get-sauce] }
    get:
      operationId: getEngineSettings
      summary: Read global settings for one engine
      tags: [engines]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Engine settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EngineSettingsOut' }
    put:
      operationId: updateEngineSettings
      summary: Update global settings for one engine
      tags: [engines]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EngineSettingsInput' }
            example:
              settings: {format: 'best[height<=720]/best', write_subtitles: false}
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Saved engine settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EngineSettingsOut' }
        '422': { description: Invalid setting }
  /cookies:
    get:
      operationId: listCookieFiles
      summary: List uploaded cookie file names and sizes without reading their contents
      tags: [engines]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Cookie file inventory
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/CookieFileOut' } }
  /cookies/{filename}:
    parameters:
      - name: filename
        in: path
        required: true
        schema: { type: string }
    put:
      operationId: uploadCookieFile
      summary: Store a Netscape-format cookie export in the private service data volume
      tags: [engines]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content_base64]
              properties:
                content_base64: { type: string, minLength: 4, maxLength: 1400000 }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Stored cookie file; content is never returned
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CookieUploadedOut' }
        '422': { description: Invalid filename or file content }
    delete:
      operationId: deleteCookieFile
      summary: Delete an uploaded cookie file
      tags: [engines]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Cookie file deleted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CookieDeletedOut' }
        '404': { description: Cookie file not found }
  /presets:
    get:
      operationId: listPresets
      summary: List saved per-engine option presets
      tags: [settings]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: Saved presets }
    post:
      operationId: createPreset
      summary: Create a named engine options preset
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresetInput' }
            example:
              name: Video at 720p
              engine: yt-dlp
              description: Save bandwidth
              settings: {format: 'best[height<=720]/best'}
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '201': { description: Preset created }
        '409': { description: Preset name already exists for the engine }
  /presets/{preset_id}:
    parameters:
      - name: preset_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updatePreset
      summary: Replace a saved preset
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PresetInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '200': { description: Preset updated }
        '404': { description: Preset not found }
    delete:
      operationId: deletePreset
      summary: Delete a saved preset
      tags: [settings]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: Preset deleted }
        '404': { description: Preset not found }
  /engine-rules:
    get:
      operationId: listEngineRules
      summary: List URL host/path rules used by automatic engine selection
      tags: [settings]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: URL engine rules, ordered by priority and specificity }
    post:
      operationId: createEngineRule
      summary: Create a host suffix and path prefix engine rule
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EngineRuleInput' }
            example: {host_suffix: example.org, path_prefix: /media, engine: yt-dlp, priority: 100, enabled: true}
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '201': { description: Rule created }
        '422': { description: Invalid host or path rule }
  /engine-rules/{rule_id}:
    parameters:
      - name: rule_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: updateEngineRule
      summary: Replace a URL engine rule
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EngineRuleInput' }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/InvalidRequest' }
        '200': { description: Rule updated }
        '404': { description: Rule not found }
    delete:
      operationId: deleteEngineRule
      summary: Delete a URL engine rule
      tags: [settings]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200': { description: Rule deleted }
        '404': { description: Rule not found }
  /provenance:
    get:
      operationId: getFileProvenance
      summary: Resolve a downloaded Nextcloud file's source for its owner
      tags: [jobs]
      parameters:
        - name: owner_id
          in: query
          required: true
          schema: { type: string, minLength: 1, maxLength: 255 }
        - name: file_id
          in: query
          required: true
          schema: { type: string }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { description: File provenance not found for this owner }
        '422': { description: Invalid file identity }
        '200':
          description: Download source bound to the owner and stable Nextcloud file ID
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /jobs:
    get:
      operationId: listJobs
      summary: List recent jobs
      tags: [jobs]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
        - name: status
          in: query
          schema: { type: string }
        - name: state
          in: query
          description: Friendly Library state filter, independent of exact status
          schema: { type: string, enum: [all, active, delivered, failed], default: all }
        - name: q
          in: query
          description: Search URL and delivered filenames (maximum 128 characters)
          schema: { type: [string, 'null'], maxLength: 128 }
        - name: offset
          in: query
          description: Zero-based pagination offset
          schema: { type: integer, minimum: 0, maximum: 10000, default: 0 }
        - name: standalone_only
          in: query
          description: Exclude Nextcloud-owned jobs from the standalone Library
          schema: { type: boolean, default: false }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Recent jobs
          content:
            application/json:
              schema: { type: array, items: { $ref: '#/components/schemas/JobOut' } }
    post:
      operationId: submitJob
      summary: Submit a download job
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobCreate' }
            examples:
              simplest:
                summary: Download a public link with automatic engine selection
                value: {url: 'https://example.org/sample.mp4', engine: auto}
              quality:
                summary: Request yt-dlp quality
                value: {url: 'https://example.org/video', engine: yt-dlp, overrides: {format: 'best[height<=720]/best'}}
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '202':
          description: Job queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOut' }
        '422': { description: Invalid URL or options }
  /jobs/batch:
    post:
      operationId: submitBatch
      summary: Atomically queue up to 50 download jobs
      tags: [jobs]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/JobBatchCreate' }
            example:
              items:
                - {url: 'https://example.org/one.mp4', engine: auto}
                - {url: 'https://example.org/two.mp4', engine: auto}
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '202':
          description: All batch items queued
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobBatchOut' }
        '422': { description: Invalid batch item; no items are queued }
  /jobs/retry-failed:
    post:
      operationId: retryFailedStandaloneJobs
      summary: Retry failed and cancelled standalone downloads
      description: >-
        Queues up to 1000 failed or cancelled jobs without an owner ID. Never
        retries Nextcloud user-owned jobs; does not modify already active jobs.
      tags: [jobs]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Number of standalone jobs requeued
          content:
            application/json:
              schema:
                type: object
                required: [retried]
                properties: { retried: { type: integer, minimum: 0 } }
              example: { retried: 3 }
        '422': { description: Too many failed jobs for one operation }
  /jobs/history:
    delete:
      operationId: clearStandaloneJobHistory
      summary: Clear only completed/failed/cancelled standalone job history
      description: >-
        Requires explicit confirm=true and never deletes downloaded local or
        Nextcloud Files. Cannot affect running jobs or per-user provenance.
        Re-delivery of forgotten jobs will no longer be available.
      tags: [jobs]
      parameters:
        - name: confirm
          in: query
          required: true
          schema: { type: boolean, enum: [true] }
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Number of forgotten standalone records; files are retained
          content:
            application/json:
              schema:
                type: object
                required: [deleted, files_retained]
                properties: { deleted: { type: integer, minimum: 0 }, files_retained: { type: boolean } }
              example: { deleted: 12, files_retained: true }
        '422': { description: Explicit confirmation required }
  /jobs/{job_id}:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: getJob
      summary: Read job state, progress, logs, and delivered files
      tags: [jobs]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Job details
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOut' }
        '404': { description: Job not found }
  /jobs/{job_id}/cancel:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: cancelJob
      summary: Request cancellation of a queued or running job
      tags: [jobs]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Cancellation requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOut' }
        '409': { description: Job cannot be cancelled in its current state }
  /jobs/{job_id}/retry:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: retryJob
      summary: Queue a failed or cancelled job again
      tags: [jobs]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '202':
          description: Job queued for retry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOut' }
        '409': { description: Job is not retryable }
  /jobs/{job_id}/redeliver:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      operationId: redeliverJob
      summary: Re-deliver completed and still-verified files to the current destination without downloading again
      tags: [jobs]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '202':
          description: Verified original output files queued for re-delivery
          content:
            application/json:
              schema: { $ref: '#/components/schemas/JobOut' }
        '404': { description: Job not found }
        '409': { description: Job is not completed or verified source files are unavailable }
  /jobs/{job_id}/events:
    parameters:
      - name: job_id
        in: path
        required: true
        schema: { type: string, format: uuid }
    get:
      operationId: streamJobEvents
      summary: Stream job updates using Server-Sent Events
      tags: [jobs]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Job updates as SSE events
          content:
            text/event-stream:
              schema: { type: string }
  /delivery:
    get:
      operationId: getDeliverySettings
      summary: Read delivery destination settings without revealing secrets
      tags: [delivery]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Delivery mode and masked credentials state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliverySettingsOut' }
    put:
      operationId: updateDeliverySettings
      summary: Configure local or WebDAV delivery
      tags: [delivery]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DeliverySettingsInput' }
            examples:
              local:
                summary: Store finished files on the downloader server
                value: {mode: local, folder: Downloader}
              webdav:
                summary: Send delivered files to Nextcloud WebDAV
                value: {mode: webdav, webdav_url: 'https://cloud.example.org/remote.php/dav/files/example', username: example, folder: Downloads}
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Saved delivery settings
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliverySettingsOut' }
        '422': { description: Invalid delivery settings }
  /delivery/test:
    post:
      operationId: testDeliveryDestination
      summary: Verify the configured destination by uploading and removing a small temporary test file
      description: >-
        Requires the administrator API token. Local mode writes, reads and removes
        a temporary file in the local output folder. WebDAV mode creates the
        configured folder when missing, then uploads, verifies size and exact
        bytes by readback, and deletes a unique test file. A failed cleanup
        must be treated as failed verification. No credentials are returned.
      tags: [delivery]
      responses:
        '401': { $ref: '#/components/responses/Unauthorized' }
        '200':
          description: Destination verified and temporary file removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeliveryTestOut' }
              example:
                mode: webdav
                verified: true
                cleaned_up: true
                message: WebDAV test upload, readback and cleanup all succeeded
        '422': { description: Destination not configured, unreachable, unverified or cleanup failed }
components:
  responses:
    Unauthorized:
      description: Missing or invalid X-API-Key header
      content:
        application/json:
          schema:
            type: object
            required: [detail]
            properties:
              detail: { type: string }
    InvalidRequest:
      description: Invalid request body or service-specific validation error
      content:
        application/json:
          schema:
            type: object
            required: [detail]
            properties:
              detail:
                anyOf:
                  - { type: string }
                  - { type: array, items: { type: object } }
                  - { type: object }
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  schemas:
    EngineStatusOut:
      type: object
      required: [name, label, role, priority, available, installed, version, defaults]
      properties:
        name: { type: string, enum: [yt-dlp, aria2c, gallery-dl, generic, you-get, svtplay-dl, get-sauce] }
        label: { type: string }
        role: { type: string }
        priority: { type: string }
        available: { type: boolean }
        installed: { type: boolean }
        version: { type: [string, 'null'] }
        defaults: { type: object, additionalProperties: true }
    EngineOptionFieldOut:
      type: object
      required: [key, label, category, type, description]
      properties:
        key: { type: string }
        label: { type: string }
        category: { type: string }
        type: { type: string }
        description: { type: string }
        minimum: { type: [integer, 'null'], default: null }
        maximum: { type: [integer, 'null'], default: null }
    EngineOptionsOut:
      type: object
      required: [engine, fields]
      properties:
        engine: { type: string, enum: [yt-dlp, aria2c, gallery-dl, generic, you-get, svtplay-dl, get-sauce] }
        fields: { type: array, items: { $ref: '#/components/schemas/EngineOptionFieldOut' } }
    EngineSettingsOut:
      type: object
      required: [engine, settings]
      properties:
        engine: { type: string, enum: [yt-dlp, aria2c, gallery-dl, generic, you-get, svtplay-dl, get-sauce] }
        settings: { type: object, additionalProperties: true }
    CookieFileOut:
      type: object
      required: [filename, size_bytes]
      properties:
        filename: { type: string }
        size_bytes: { type: integer, minimum: 0 }
    CookieUploadedOut:
      type: object
      required: [filename, size_bytes, stored]
      properties:
        filename: { type: string }
        size_bytes: { type: integer, minimum: 0 }
        stored: { type: boolean }
    CookieDeletedOut:
      type: object
      required: [deleted, filename]
      properties:
        deleted: { type: boolean }
        filename: { type: string }
    DeliveryTestOut:
      type: object
      required: [mode, verified, cleaned_up, message]
      properties:
        mode: { type: string, enum: [local, webdav] }
        verified: { type: boolean }
        cleaned_up: { type: boolean }
        message: { type: string }
    DeliverySettingsOut:
      type: object
      required: [mode, folder, password_configured]
      properties:
        mode: { type: string, enum: [local, webdav] }
        folder: { type: string }
        password_configured: { type: boolean }
        webdav_url: { type: [string, 'null'], default: null }
        username: { type: [string, 'null'], default: null }
    JobOut:
      type: object
      required: [id, url, engine, status, overrides, progress, output_files, log_text, error, cancel_requested, created_at, updated_at, finished_at]
      properties:
        id: { type: string }
        url: { type: string }
        owner_id: { type: [string, 'null'], default: null }
        engine: { type: string }
        status: { type: string }
        overrides: { type: object, additionalProperties: true }
        progress: { type: object, additionalProperties: true }
        output_files: { type: array, items: { type: object, additionalProperties: true } }
        log_text: { type: string }
        error: { type: [string, 'null'] }
        cancel_requested: { type: boolean }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        finished_at: { type: [string, 'null'], format: date-time }
    JobBatchOut:
      type: object
      required: [created, jobs]
      properties:
        created: { type: integer }
        jobs: { type: array, items: { $ref: '#/components/schemas/JobOut' } }
    JobCreate:
      type: object
      required: [url]
      properties:
        url: { type: string, minLength: 8, maxLength: 4096 }
        engine: { type: string, enum: [auto, yt-dlp, aria2c, gallery-dl, generic, you-get, svtplay-dl, get-sauce], default: auto }
        preset_id: { type: [string, 'null'], maxLength: 36, default: null }
        overrides: { type: object, additionalProperties: true }
        owner_id: { type: [string, 'null'], minLength: 1, maxLength: 255, pattern: '^[^/\\\\\x00-\x1f]+$', default: null }
        delivery: { type: [object, 'null'], additionalProperties: true, default: null }
    JobBatchCreate:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 50
          items: { $ref: '#/components/schemas/JobCreate' }
    PresetInput:
      type: object
      required: [name, engine]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        engine: { type: string, enum: [yt-dlp, aria2c, gallery-dl, generic, you-get, svtplay-dl, get-sauce] }
        settings: { type: object, additionalProperties: true }
        description: { type: string, maxLength: 1000, default: '' }
    EngineRuleInput:
      type: object
      required: [host_suffix, engine]
      properties:
        host_suffix: { type: string, minLength: 3, maxLength: 255, description: Hostname suffix without scheme or wildcard. Matches the exact host and its subdomains. }
        path_prefix: { type: string, maxLength: 1024, default: / }
        engine: { type: string, enum: [yt-dlp, aria2c, gallery-dl, generic, you-get, svtplay-dl, get-sauce] }
        priority: { type: integer, minimum: 0, maximum: 1000, default: 100 }
        enabled: { type: boolean, default: true }
        description: { type: string, maxLength: 255, default: '' }
    EngineSettingsInput:
      type: object
      properties:
        settings: { type: object, additionalProperties: true }
    DeliverySettingsInput:
      type: object
      properties:
        mode: { type: string, enum: [local, webdav], default: local }
        webdav_url: { type: [string, 'null'], maxLength: 2048, default: null }
        username: { type: [string, 'null'], maxLength: 255, default: null }
